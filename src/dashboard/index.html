<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Assembly | Analytics Suite</title>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
            --primary: #3b82f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--card-bg);
        }
        .header-controls { display: flex; gap: 15px; align-items: center; }
        .status-badge {
            padding: 5px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; background-color: var(--danger);
        }
        .status-badge.connected { background-color: var(--accent); }
        .export-btn {
            background-color: var(--primary); color: white; border: none; padding: 8px 16px; 
            border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer;
        }
        
        /* KPI Grid */
        .kpi-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;
        }
        .kpi-card {
            background-color: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .kpi-card h3 { margin: 0 0 10px 0; color: var(--text-muted); font-size: 14px; text-transform: uppercase; }
        .kpi-card .value { font-size: 32px; font-weight: bold; }

        /* Chart Grid */
        .analytics-grid {
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 350px 350px; gap: 20px;
        }
        .chart-container {
            background-color: var(--card-bg); border-radius: 10px; padding: 15px; position: relative;
        }
        .chart-title {
            position: absolute; top: 15px; left: 20px; color: var(--text-muted); font-size: 14px; 
            font-weight: bold; text-transform: uppercase; z-index: 10;
        }
        
        /* Compressed Table */
        .table-container { overflow-y: auto; height: 300px; margin-top: 25px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #334155; }
        th { color: var(--text-muted); position: sticky; top: 0; background: var(--card-bg); }
    </style>
</head>
<body>

    <div class="header">
        <h2>Smart Assembly Analytics Suite</h2>
        <div class="header-controls">
            <button class="export-btn" onclick="exportCSV()">Export Session CSV</button>
            <div id="conn-status" class="status-badge">DISCONNECTED</div>
        </div>
    </div>

    <div class="kpi-grid">
        <div class="kpi-card"><h3>Current Shift</h3><div id="kpi-shift" class="value">Waiting...</div></div>
        <div class="kpi-card"><h3>Shift Volume</h3><div id="kpi-total" class="value">0</div></div>
        <div class="kpi-card"><h3>Avg Transit</h3><div id="kpi-time" class="value">0.0s</div></div>
        <div class="kpi-card"><h3>Last Angle</h3><div id="kpi-angle" class="value">0°</div></div>
    </div>

    <div class="analytics-grid">
        <div class="chart-container">
            <div class="chart-title">Orientation Drift Control</div>
            <div id="plot-orientation" style="width:100%; height:100%;"></div>
        </div>
        
        <div class="chart-container">
            <div class="chart-title">Transit Time Distribution</div>
            <div id="plot-transit" style="width:100%; height:100%;"></div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Cumulative Shift Volume</div>
            <div id="plot-volume" style="width:100%; height:100%;"></div>
        </div>

        <div class="chart-container">
            <div class="chart-title">Raw Event Log</div>
            <div class="table-container">
                <table>
                    <thead><tr><th>Time</th><th>ID</th><th>Transit(s)</th><th>Angle(°)</th></tr></thead>
                    <tbody id="log-body"></tbody>
                </table>
            </div>
        </div>
    </div>

<script>
        // --- 1. PLOTLY INITIALIZATION & LAYOUTS ---
        const darkLayout = {
            paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
            font: { color: '#94a3b8' }, margin: { t: 40, b: 30, l: 40, r: 20 },
            xaxis: { gridcolor: '#334155', zerolinecolor: '#334155' },
            yaxis: { gridcolor: '#334155', zerolinecolor: '#334155' }
        };

        const layoutOrientation = {
            ...darkLayout,
            yaxis: { title: 'Angle (Degrees)', range: [-90, 90], gridcolor: '#334155' },
            shapes: [{
                type: 'rect', y0: -15, y1: 15, x0: 0, x1: 1, xref: 'paper', yref: 'y',
                fillcolor: 'rgba(16, 185, 129, 0.15)', line: { width: 0 }
            }]
        };

        const layoutTransit = {
            ...darkLayout, 
            xaxis: { title: 'Seconds on Belt', range: [0, 15] }, 
            yaxis: { title: 'Frequency' }
        };

        const layoutVolume = {
            ...darkLayout,
            yaxis: { title: 'Total Boxes Counted', gridcolor: '#334155' }
        };

        // State Arrays
        let scatterX = [], scatterY = [], scatterColors = [];
        let transitDataArray = [];
        let sessionData = []; 

        // Initial Empty Plots
        Plotly.newPlot('plot-orientation', [{ x: [], y: [], mode: 'markers' }], layoutOrientation, {displayModeBar: false});
        Plotly.newPlot('plot-transit', [{ x: [], type: 'histogram' }], layoutTransit, {displayModeBar: false});
        Plotly.newPlot('plot-volume', [{ x: [], y: [], type: 'scatter', mode: 'lines+markers', line: { color: '#10b981', width: 3 } }], layoutVolume, {displayModeBar: false});

        // --- 2. WEBSOCKET & DATA HANDLING ---
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${wsProtocol}//${window.location.host}/ws`);
        let totalTime = 0, boxCount = 0, activeShift = null;

        socket.onopen = () => {
            document.getElementById('conn-status').textContent = "CONNECTED (LIVE)";
            document.getElementById('conn-status').classList.add("connected");
        };

        socket.onerror = () => {
            document.getElementById('conn-status').textContent = "CONNECTION ERROR";
            document.getElementById('conn-status').classList.remove("connected");
        };

        socket.onclose = () => {
            document.getElementById('conn-status').textContent = "DISCONNECTED";
            document.getElementById('conn-status').classList.remove("connected");
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);
            sessionData.push(data);
            const time = new Date(data.timestamp_iso);

            // Update KPIs
            if (activeShift !== data.shift) {
                activeShift = data.shift;
                totalTime = 0;
            }
            boxCount = data.shift_count;
            totalTime += data.transit_time_sec;
            document.getElementById('kpi-shift').textContent = data.shift.replace("_", " ");
            document.getElementById('kpi-total').textContent = boxCount;
            document.getElementById('kpi-time').textContent = (totalTime / boxCount).toFixed(2) + "s";
            document.getElementById('kpi-angle').textContent = data.orientation_deg + "°";

            // --- A. Scatter Plot Update (Forced Re-render via Spread Operator) ---
            const dotColor = Math.abs(data.orientation_deg) > 15 ? '#ef4444' : '#10b981';
            
            scatterX.push(time);
            scatterY.push(data.orientation_deg);
            scatterColors.push(dotColor);
            
            if(scatterX.length > 50) { 
                scatterX.shift(); scatterY.shift(); scatterColors.shift(); 
            }
            
            Plotly.react('plot-orientation', [{
                x: [...scatterX], 
                y: [...scatterY], 
                mode: 'markers', 
                marker: { size: 10, color: [...scatterColors] }
            }], layoutOrientation);

            // --- B. Histogram Update (Forced Re-render via Spread Operator) ---
            transitDataArray.push(data.transit_time_sec);
            Plotly.react('plot-transit', [{ 
                x: [...transitDataArray], 
                type: 'histogram', 
                marker: { color: '#3b82f6' },
                xbins: { start: 0, end: 20, size: 0.5 } 
            }], layoutTransit);

            // --- C. Volume Line Update (extendTraces handles its own state) ---
            Plotly.extendTraces('plot-volume', {
                x: [[time]],
                y: [[boxCount]]
            }, [0], 50);

            // Update Table
            const row = `<tr><td>${time.toLocaleTimeString()}</td><td><strong>${data.uuid}</strong></td>
                         <td>${data.transit_time_sec.toFixed(2)}</td>
                         <td style="color:${dotColor}">${data.orientation_deg}°</td></tr>`;
            const tbody = document.getElementById('log-body');
            tbody.insertAdjacentHTML('afterbegin', row);
            if(tbody.children.length > 20) tbody.lastElementChild.remove();
        };

        // --- 3. CSV EXPORT ---
        function exportCSV() {
            if (sessionData.length === 0) return alert("No data to export.");
            const headers = ["Timestamp", "UUID", "Shift", "Count", "Transit_Sec", "Angle_Deg"];
            const rows = sessionData.map(d => [d.timestamp_iso, d.uuid, d.shift, d.shift_count, d.transit_time_sec, d.orientation_deg].join(","));
            const blob = new Blob([[headers.join(","), ...rows].join("\n")], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Assembly_Analytics_${new Date().toISOString().slice(0,10)}.csv`;
            link.click();
        }
    </script>
</body>
</html>
