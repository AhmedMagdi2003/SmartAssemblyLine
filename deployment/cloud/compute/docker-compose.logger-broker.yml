services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: smart-assembly-cloud-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log

  logger:
    image: REGION-docker.pkg.dev/PROJECT_ID/smart-assembly/logger:latest
    container_name: smart-assembly-cloud-logger
    restart: unless-stopped
    env_file:
      - ../env/logger.env
    depends_on:
      - mqtt

volumes:
  mosquitto-data:
  mosquitto-log:
