apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: smart-assembly-migrate
spec:
  template:
    template:
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/smart-assembly/migrate:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: smart-assembly-database-url
                  key: latest
      taskCount: 1
      parallelism: 1
      timeout: 900s
