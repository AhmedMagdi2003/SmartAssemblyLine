services:
  smart-assembly-db:
    image: pgvector/pgvector:0.8.2-pg17
    container_name: smart-assembly-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_assembly
      POSTGRES_USER: smartassembly
      POSTGRES_PASSWORD: smartassembly
    ports:
      - "5433:5432"
    volumes:
      - smart_assembly_db_data:/var/lib/postgresql/data

volumes:
  smart_assembly_db_data:
